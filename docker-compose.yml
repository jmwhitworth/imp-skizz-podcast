services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imp_skizz_backend
    # Commented out as Dokploy uses traefik for routing
    #ports:
    #  - "8000:8000"
    env_file:
      - .env
    networks:
      - dokploy-network
    command: >
      sh -c "
        python ./manage.py migrate --no-input
        exec gunicorn podcast_index.wsgi --bind 0.0.0.0:8000 --access-logfile -
      "

networks:
  dokploy-network:
    external: true
